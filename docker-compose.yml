services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: campus-pedia-pgvector
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus_pedia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
