services:
  mysql:
    image: mysql:8
    container_name: campus-pedia-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: campus_pedia
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    container_name: campus-pedia-redis
    ports:
      - "6379:6379"

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: campus-pedia-pgvector
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus_pedia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  mysql_data:
  pgdata:
