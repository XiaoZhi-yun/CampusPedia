spring:
  application:
    name: campus-pedia
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

# API 密钥通过环境变量注入（见 .env.example），不写死、不进仓库
campus-pedia:
  llm:
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    deepseek-base-url: https://api.deepseek.com
    model: deepseek-chat
  embedding:
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
    dashscope-base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen3.7-text-embedding-flash
    provider: ${EMBEDDING_PROVIDER:hash}
  vector-store:
    type: ${VECTOR_STORE_TYPE:memory}