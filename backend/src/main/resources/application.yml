server:
  port: 8081   # 避开 MaxKB 占用的 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/campus_pedia?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

campus:
  llm:
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    deepseek-base-url: https://api.deepseek.com
    model: deepseek-chat
  embedding:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen3.7-text-embedding-flash
    dimensions: 1024
    provider: ${EMBEDDING_PROVIDER:hash}
  rerank:
    api-key: ${DASHSCOPE_API_KEY:}
    url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    model: qwen3.7-text-rerank
  jwt:
    secret: ${JWT_SECRET:campuspedia-jwt-secret-key-2026-please-change}
    expire-hours: 24
  pgvector:
    host: 127.0.0.1
    port: 5432
    database: campus_pedia
    username: campus
    password: campus
  storage:
    path: uploads
  corpus:
    path: ../corpus/example